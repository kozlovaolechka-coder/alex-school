<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лена · Гараж машин</title><style>body{font:18px system-ui;background:#f2f6ff;color:#18243b;margin:0;padding:18px}main{max-width:700px;margin:auto;background:white;border-radius:18px;padding:22px}svg{width:100%;height:auto}button{padding:12px 18px;border:0;border-radius:12px;background:#2756a5;color:white;margin:5px;cursor:pointer}#feedback{padding:15px;background:#e9f1ff;border-radius:12px;min-height:45px}small{color:#596779}</style></head><body><main><a href="/">← Алекс Школа</a><h1>🏎️ Гараж машин</h1><p>Математика · Множества · 3 класс</p><svg viewBox="0 0 340 225" role="img" aria-label="Большой синий овал А со всеми машинами, внутри красный овал Б с красными машинами"><ellipse cx="170" cy="115" rx="155" ry="103" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="36" y="40" font-size="13">A — все машины</text><ellipse cx="210" cy="135" rx="105" ry="72" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="155" y="91" font-size="13">B — красные</text><text x="42" y="146" font-size="35">🚙</text><text x="142" y="152" font-size="35">🚗</text><text x="228" y="152" font-size="35">🏎️</text></svg><h2>Вопрос Лены</h2><p id="question">Все ли машины из множества Б входят в множество А?</p><button onclick="answer(true)">Да</button><button onclick="answer(false)">Нет</button><button onclick="hint()">💡 Подсказка</button><button onclick="speak()">🔊 Прочитать</button><div id="feedback" aria-live="polite">Выбери ответ и объясни, почему так думаешь.</div><p><small>Пробный урок: озвучивание браузером. Непрерывный голосовой ИИ и запись в Supabase пока не подключены.</small></p></main><script>function answer(ok){document.getElementById('feedback').textContent=ok?'Верно! А теперь объясни своими словами, почему красные машины входят в множество всех машин.':'Посмотри, находится ли красный овал целиком внутри синего. Попробуй ещё раз.'}function hint(){document.getElementById('feedback').textContent='Есть ли хотя бы одна машина из красного овала за границей синего?'}function speak(){if(!('speechSynthesis' in window)){document.getElementById('feedback').textContent='В этом браузере озвучивание недоступно';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(document.getElementById('question').textContent);u.lang='ru-RU';speechSynthesis.speak(u)}</script></body></html>
